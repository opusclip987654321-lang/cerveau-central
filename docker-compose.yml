services:
  cerveau:
    build: .
    container_name: cerveau-central
    restart: unless-stopped
    env_file: .env
    environment:
      HOTE: 0.0.0.0
    # Joignable depuis le serveur lui-même (tunnel SSH) et par Caddy, qui le publie
    # sur cerveau.nourmeet.com derrière le mot de passe. Jamais exposé directement.
    ports:
      - "127.0.0.1:8090:8090"
    volumes:
      - cerveau-data:/app/data
      - ./config:/app/config:ro
      # Petites histoires vraies : le cerveau lit seulement (vidéos publiées, histoires lancées).
      - /opt/nour-video-agent/data:/sources/histoires:ro
      # Leviaro : le cerveau copie sa base (leviaro.db) pour en lire les chiffres, sans y écrire.
      - /home/ubuntu/leviaro-agent/data:/sources/leviaro:ro
      # Code des deux agents (lecture seule) : servi par /api/code avec le jeton des
      # relevés, pour que Claude tienne les guides à jour sans demander à louis.
      # Les secrets (.env), bases et dossiers data en sont exclus par le cerveau.
      - /home/ubuntu/leviaro-agent:/sources/leviaro-code:ro
      - /opt/nour-video-agent:/sources/histoires-code:ro
    networks:
      - default
      - caddy

volumes:
  cerveau-data:

networks:
  # Le réseau Docker où tourne Caddy (celui du projet nour-meet). Voir README.
  caddy:
    external: true
    name: ${RESEAU_CADDY:-nour-meet_default}
